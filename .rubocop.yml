inherit_gem:
  axn: .rubocop.yml

# Local delta: axn's shared config sets Style/StringLiterals (double_quotes) but not
# Style/StringLiteralsInInterpolation, which defaults to single_quotes. This gem uses
# double quotes inside interpolations too, so pin it here.
Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

# Local deltas: hold this gem to tighter Metrics limits than axn's shared
# defaults (axn: MethodLength 70 / ClassLength 250 / AbcSize 60), sized to
# this gem's own high-water marks. Profile carries a targeted per-class
# disable for the 150-line ClassLength cap.
Metrics/MethodLength:
  Max: 30
Metrics/ClassLength:
  Max: 150
Metrics/AbcSize:
  Max: 32
